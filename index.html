<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tip Calculator</title>
    <!-- Load Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Load Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            /* Subtle animated gradient background */
            background: linear-gradient(135deg, #f0fdf4 0%, #e0f2fe 100%);
        }
        /* Hide number input spinners for a cleaner look */
        input[type=number]::-webkit-inner-spin-button, 
        input[type=number]::-webkit-outer-spin-button { 
            -webkit-appearance: none; 
            margin: 0; 
        }
        input[type=number] {
            -moz-appearance: textfield;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 text-gray-800">

    <main class="w-full max-w-md bg-white rounded-2xl shadow-xl overflow-hidden transition-all border border-gray-100">
        <!-- Header -->
        <div class="bg-emerald-600 p-6 text-center">
            <h1 class="text-2xl font-bold text-white mb-1">Tip Calculator</h1>
            <p class="text-emerald-100 text-sm">Enter your bill to see tip options</p>
        </div>

        <div class="p-6 md:p-8">
            <!-- Bill Input Area -->
            <div class="mb-8 relative">
                <label for="billAmount" class="block text-sm font-medium text-gray-600 mb-2">Receipt Amount</label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                        <span class="text-gray-500 sm:text-xl font-semibold">$</span>
                    </div>
                    <input 
                        type="number" 
                        id="billAmount" 
                        class="block w-full pl-10 pr-4 py-3 bg-gray-50 border border-gray-200 rounded-xl text-2xl font-bold text-gray-800 placeholder-gray-300 focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:bg-white transition-colors"
                        placeholder="0.00" 
                        step="0.01" 
                        min="0">
                </div>
            </div>

            <!-- Preset Tip Options -->
            <div class="mb-5 grid grid-cols-3 gap-3">
                <button type="button" class="preset-btn bg-gray-50 text-gray-700 border border-gray-200 hover:bg-emerald-50 rounded-xl py-2 flex flex-col items-center transition-colors" data-val="15">
                    <span class="text-sm font-semibold">Decent</span>
                    <span class="text-xs opacity-75">15%</span>
                </button>
                <button type="button" class="preset-btn bg-gray-50 text-gray-700 border border-gray-200 hover:bg-emerald-50 rounded-xl py-2 flex flex-col items-center transition-colors" data-val="18">
                    <span class="text-sm font-semibold">Good</span>
                    <span class="text-xs opacity-75">18%</span>
                </button>
                <button type="button" class="preset-btn bg-emerald-100 text-emerald-800 border border-emerald-300 hover:bg-emerald-50 rounded-xl py-2 flex flex-col items-center transition-colors" data-val="20">
                    <span class="text-sm font-semibold">Excellent</span>
                    <span class="text-xs opacity-75">20%</span>
                </button>
            </div>

            <!-- Custom Tip Percentage -->
            <div class="mb-6">
                <div class="flex justify-between items-center mb-2">
                    <label for="tipPercentage" class="block text-sm font-medium text-gray-600">Tip Percentage</label>
                    <span id="percentageDisplay" class="text-emerald-600 font-bold text-lg">20%</span>
                </div>
                <input 
                    type="range" 
                    id="tipPercentage" 
                    min="0" 
                    max="100" 
                    value="20" 
                    class="w-full h-2 bg-gray-200 rounded-lg appearance-none cursor-pointer accent-emerald-600 hover:accent-emerald-500 transition-all">
            </div>

            <!-- Generate Button -->
            <button 
                id="generateBtn" 
                class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-3 px-4 rounded-xl shadow-sm hover:shadow-md transition-all active:scale-[0.98] mb-4">
                Generate Total
            </button>

            <!-- Results Section -->
            <div id="resultsSection" class="bg-emerald-50 border border-emerald-100 rounded-xl p-5 hidden">
                <div class="flex justify-between items-center mb-3 pb-3 border-b border-emerald-200/60">
                    <span class="text-sm font-medium text-gray-600 uppercase tracking-wide">Tip Amount</span>
                    <span class="text-lg font-semibold text-gray-800" id="resultTip">$0.00</span>
                </div>
                <div class="flex justify-between items-center">
                    <span class="text-sm font-medium text-gray-600 uppercase tracking-wide">Total Bill</span>
                    <span class="text-3xl font-bold text-emerald-700" id="resultTotal">$0.00</span>
                </div>
            </div>

        </div>
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const billInput = document.getElementById('billAmount');
            const tipPercentageInput = document.getElementById('tipPercentage');
            const percentageDisplay = document.getElementById('percentageDisplay');
            const generateBtn = document.getElementById('generateBtn');
            const resultsSection = document.getElementById('resultsSection');
            const resultTip = document.getElementById('resultTip');
            const resultTotal = document.getElementById('resultTotal');
            const presetBtns = document.querySelectorAll('.preset-btn');

            // Currency formatter
            const currencyFormatter = new Intl.NumberFormat('en-US', {
                style: 'currency',
                currency: 'USD',
            });

            // Update percentage display when slider moves
            tipPercentageInput.addEventListener('input', (e) => {
                percentageDisplay.textContent = `${e.target.value}%`;
                // Hide results when adjusting to prompt user to recalculate
                resultsSection.classList.add('hidden');

                // Update preset buttons visually if the slider matches their values
                presetBtns.forEach(btn => {
                    if (btn.getAttribute('data-val') === e.target.value) {
                        btn.classList.remove('bg-gray-50', 'text-gray-700', 'border-gray-200');
                        btn.classList.add('bg-emerald-100', 'text-emerald-800', 'border-emerald-300');
                    } else {
                        btn.classList.remove('bg-emerald-100', 'text-emerald-800', 'border-emerald-300');
                        btn.classList.add('bg-gray-50', 'text-gray-700', 'border-gray-200');
                    }
                });
            });

            // Handle preset button clicks
            presetBtns.forEach(btn => {
                btn.addEventListener('click', () => {
                    const val = btn.getAttribute('data-val');
                    
                    // Sync the slider to the preset value
                    tipPercentageInput.value = val;
                    percentageDisplay.textContent = `${val}%`;
                    resultsSection.classList.add('hidden');

                    // Reset styling on all preset buttons
                    presetBtns.forEach(b => {
                        b.classList.remove('bg-emerald-100', 'text-emerald-800', 'border-emerald-300');
                        b.classList.add('bg-gray-50', 'text-gray-700', 'border-gray-200');
                    });
                    
                    // Highlight the clicked button
                    btn.classList.remove('bg-gray-50', 'text-gray-700', 'border-gray-200');
                    btn.classList.add('bg-emerald-100', 'text-emerald-800', 'border-emerald-300');
                });
            });

            // Hide results when bill amount changes
            billInput.addEventListener('input', () => {
                resultsSection.classList.add('hidden');
            });

            // Calculate when button is clicked
            generateBtn.addEventListener('click', () => {
                const bill = parseFloat(billInput.value);
                const rate = parseFloat(tipPercentageInput.value);

                // Input Validation
                if (isNaN(bill) || bill < 0) {
                    // Flash red border to indicate invalid/empty input
                    billInput.classList.add('ring-2', 'ring-red-400', 'border-red-400');
                    setTimeout(() => {
                        billInput.classList.remove('ring-2', 'ring-red-400', 'border-red-400');
                    }, 800);
                    return;
                }

                // Calculation logic
                const tipAmount = bill * (rate / 100);
                const totalAmount = bill + tipAmount;

                // Update the text in the results container
                resultTip.textContent = currencyFormatter.format(tipAmount);
                resultTotal.textContent = currencyFormatter.format(totalAmount);
                
                // Show the results
                resultsSection.classList.remove('hidden');
            });

            // Automatically focus the input field on page load for convenience
            billInput.focus();
        });
    </script>
</body>
</html>
